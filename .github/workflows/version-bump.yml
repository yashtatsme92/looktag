name: version-bump

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a package version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-version-bump.mjs "$BASE_SHA"
