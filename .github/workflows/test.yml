name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-provider-imports.mjs
      - run: node --experimental-strip-types --test 'src/lib/**/*.test.ts' 'src/config/**/*.test.ts'
      - run: npm run test:integration

  e2e-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E suites
        run: |
          export VITE_AUTH_ENABLED=true
          export ADMIN_EMAIL=admin@looktag.studio
          export ADMIN_BOOTSTRAP_PASSWORD="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          export BETTER_AUTH_URL=http://127.0.0.1:8080
          # Broker counts as configured only with an explicit issuer (Apple/X e2e).
          export GROK_AUTH_ISSUER=https://auth.grok.me
          npm run dev > /tmp/looktag-e2e-dev.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null || {
            cat /tmp/looktag-e2e-dev.log
            exit 1
          }
          # No Google credentials on this server: no Google button (before any admin toggles).
          GOOGLE_EXPECT=off BASE_URL=http://127.0.0.1:8080 npm run test:e2e:google
          BASE_URL=http://127.0.0.1:8080 npm run test:e2e:splash
          npm run test:e2e:guest
          npm run test:e2e:aspect
          npm run test:e2e:create-phone
          npm run test:e2e:ios-standalone
          npm run test:e2e:create-desktop
          npm run test:e2e:auth-methods
          npm run test:ui
          BASE_URL=http://127.0.0.1:8080 npm run test:e2e:domain
          # Links ON: wheel-scroll + footer hit-test at phone/tablet/desktop (#188 r2).
          kill "$app_pid" 2>/dev/null || true; pkill -f "vite dev" || true
          for attempt in $(seq 1 30); do curl --silent http://127.0.0.1:8080/ >/dev/null || break; sleep 1; done
          FOOTER_INSTAGRAM_URL=https://instagram.com/thelooktag FOOTER_LINKS_ENABLED=about,privacy,terms,contact,impressum,instagram npm run dev > /tmp/looktag-e2e-dev-links.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          FOOTER_EXPECT=all BASE_URL=http://127.0.0.1:8080 npm run test:e2e:domain
          # Dummy Google credentials: the Google button shows with no admin switch.
          kill "$app_pid" 2>/dev/null || true; pkill -f "vite dev" || true
          for attempt in $(seq 1 30); do curl --silent http://127.0.0.1:8080/ >/dev/null || break; sleep 1; done
          GOOGLE_CLIENT_ID=ci-dummy-google-client-id GOOGLE_CLIENT_SECRET=ci-dummy-google-client-secret npm run dev > /tmp/looktag-e2e-dev-google.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          GOOGLE_EXPECT=on BASE_URL=http://127.0.0.1:8080 npm run test:e2e:google

  prod-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the production server
        # Bare vite build, not `npm run build`. The npm script also runs
        # scripts/copy-pglite-assets.mjs, which already copies these files on
        # main, so it would not fail if this plugin were removed.
        run: |
          unset RENDER_GIT_COMMIT COMMIT_REF GITHUB_SHA VERCEL_GIT_COMMIT_SHA
          mkdir -p "$RUNNER_TEMP/no-git"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/no-git/git"
          chmod +x "$RUNNER_TEMP/no-git/git"
          PATH="$(pwd)/node_modules/.bin:$RUNNER_TEMP/no-git:$PATH" node scripts/with-app-env.mjs vite build
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-prod-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          LOOKTAG_ALLOW_EPHEMERAL_DB: "1"
      - name: Database-backed route returns 200
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-prod-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          PORT: "4173"
          HOST: 127.0.0.1
          PROD_CHECK_URL: http://127.0.0.1:4173
          LOOKTAG_ALLOW_EPHEMERAL_DB: "1"
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: |
          for file in pglite.data pglite.wasm initdb.wasm; do
            test -s ".output/server/_libs/$file" || {
              echo "missing .output/server/_libs/$file"
              find .output -name "$file" -o -name 'electric-sql__pglite*' || true
              exit 1
            }
          done
          node .output/server/index.mjs > /tmp/looktag-prod.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null || {
            cat /tmp/looktag-prod.log
            exit 1
          }
          node scripts/check-prod-db.mjs || {
            cat /tmp/looktag-prod.log
            exit 1
          }
      - name: Domain auth, 404s and HSTS on thelooktag.com env (#183)
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-prod-secret-0123456789abcdef01
          BETTER_AUTH_URL: https://thelooktag.com
          APP_URL: https://thelooktag.com
          TRUSTED_ORIGINS: https://looktag.onrender.com
          PORT: "4174"
          HOST: 127.0.0.1
          LOOKTAG_ALLOW_EPHEMERAL_DB: "1"
          DOMAIN_AUTH_URL: http://127.0.0.1:4174
        run: |
          node .output/server/index.mjs > /tmp/looktag-domain.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4174/api/auth/ok >/dev/null; then
              break
            fi
            sleep 2
          done
          node --test tests/integration/domain-auth.test.mjs || {
            cat /tmp/looktag-domain.log
            exit 1
          }

  # Optional. Not a required check. The database steps run only when a
  # DATABASE_URL secret is set (a Neon branch). The URL is never printed.
  # Do not put `secrets` in this job's `if` — GitHub rejects that context there.
  neon-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: See if a Neon URL is configured
        id: neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret is not set — skipping Neon smoke."
          fi
      - name: Migrate, seed, and check a fresh database
        if: steps.neon.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-neon-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          PORT: "4173"
          HOST: 127.0.0.1
          PROD_CHECK_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
          npm run db:seed
          PATH="$(pwd)/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
          node scripts/copy-pglite-assets.mjs
          node .output/server/index.mjs > /tmp/looktag-neon.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null || {
            cat /tmp/looktag-neon.log
            exit 1
          }
          node scripts/check-prod-db.mjs || {
            cat /tmp/looktag-neon.log
            exit 1
          }
