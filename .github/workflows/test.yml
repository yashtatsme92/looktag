name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/check-provider-imports.mjs
      - run: node --experimental-strip-types --test 'src/lib/**/*.test.ts'
      - run: npm run test:integration

  e2e-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser E2E suites
        run: |
          export VITE_AUTH_ENABLED=true
          export ADMIN_EMAIL=admin@looktag.studio
          password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          export ADMIN_BOOTSTRAP_PASSWORD="$password"
          export BETTER_AUTH_URL=http://127.0.0.1:8080
          npm run dev > /tmp/looktag-e2e-dev.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null || {
            cat /tmp/looktag-e2e-dev.log
            exit 1
          }
          npm run test:e2e:guest
          npm run test:e2e:aspect
          npm run test:e2e:create-phone
          npm run test:e2e:auth-methods
          npm run test:ui

  prod-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the production server
        # Bare vite build, not `npm run build`. The npm script also runs
        # scripts/copy-pglite-assets.mjs, which already copies these files on
        # main, so it would not fail if this plugin were removed.
        run: PATH="$(pwd)/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-prod-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          APP_URL: http://127.0.0.1:4173
          LOOKTAG_ALLOW_EPHEMERAL_DB: "1"
      - name: Database-backed route returns 200
        env:
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-prod-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          APP_URL: http://127.0.0.1:4173
          PORT: "4173"
          HOST: 127.0.0.1
          PROD_CHECK_URL: http://127.0.0.1:4173
          LOOKTAG_ALLOW_EPHEMERAL_DB: "1"
        run: |
          for file in pglite.data pglite.wasm initdb.wasm; do
            test -s ".output/server/_libs/$file" || {
              echo "missing .output/server/_libs/$file"
              find .output -name "$file" -o -name 'electric-sql__pglite*' || true
              exit 1
            }
          done
          node .output/server/index.mjs > /tmp/looktag-prod.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null || {
            cat /tmp/looktag-prod.log
            exit 1
          }
          node scripts/check-prod-db.mjs || {
            cat /tmp/looktag-prod.log
            exit 1
          }

  # Optional. Not a required check. The database steps run only when a
  # DATABASE_URL secret is set (a Neon branch). The URL is never printed.
  # Do not put `secrets` in this job's `if` — GitHub rejects that context there.
  neon-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: See if a Neon URL is configured
        id: neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret is not set — skipping Neon smoke."
          fi
      - name: Migrate, seed, and check a fresh database
        if: steps.neon.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VITE_AUTH_ENABLED: "true"
          BETTER_AUTH_SECRET: ci-neon-secret-0123456789abcdef01
          BETTER_AUTH_URL: http://127.0.0.1:4173
          APP_URL: http://127.0.0.1:4173
          PORT: "4173"
          HOST: 127.0.0.1
          PROD_CHECK_URL: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          npm run db:migrate
          npm run db:seed
          npm run db:migrate
          npm run db:seed
          PATH="$(pwd)/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
          node scripts/copy-pglite-assets.mjs
          node .output/server/index.mjs > /tmp/looktag-neon.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4173/api/auth/ok >/dev/null || {
            cat /tmp/looktag-neon.log
            exit 1
          }
          node scripts/check-prod-db.mjs || {
            cat /tmp/looktag-neon.log
            exit 1
          }

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose and Caddy
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/tmp/looktag-compose.yml
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e APP_DOMAIN=example.com caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: looktag
          POSTGRES_PASSWORD: looktag-ci-only
          POSTGRES_DB: looktag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looktag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image without a database
        run: docker build -t looktag:ci .
      - name: The image is not root and does not ship PGLite
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id looktag:ci -u)" = "10001"
          docker run --rm --entrypoint sh looktag:ci -c 'find /app -name pglite.wasm | grep -q . && exit 1 || exit 0'
      - name: Boot against Postgres
        run: |
          set -euo pipefail
          docker run -d --name looktag-ci --add-host=host.docker.internal:host-gateway \
            -e DATABASE_URL=postgres://looktag:looktag-ci-only@host.docker.internal:5432/looktag \
            -e BETTER_AUTH_SECRET=ci-image-secret \
            -e BETTER_AUTH_URL=http://127.0.0.1:18080 \
            -e APP_URL=http://127.0.0.1:18080 \
            -e AUTH_PROVIDER=better-auth \
            -e PLATFORM_CHROME=none \
            -p 18080:8080 looktag:ci
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"status":"ok"' || {
            docker logs looktag-ci
            exit 1
          }
          docker stats --no-stream --format 'rss_after_boot={{.MemUsage}}' looktag-ci
          page=$(curl --fail --silent http://127.0.0.1:18080/)
          printf '%s' "$page" | grep -q Looktag
          manifest_code=$(curl --fail --silent -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/manifest.webmanifest)
          test "$manifest_code" = "200"
          test "$(curl --silent -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/__grok/manifest.webmanifest)" = "404"
          html=$(curl --fail --silent http://127.0.0.1:18080/)
          printf '%s' "$html" | grep -q Looktag
          if printf '%s' "$html" | grep -q 'grok.com/grok-app-builder/extensions.js'; then
            echo "extensions.js leaked" >&2
            exit 1
          fi
          if printf '%s' "$html" | grep -q 'og.grok.me'; then
            echo "og.grok.me leaked" >&2
            exit 1
          fi
          cookie=$(curl --silent -D - -o /dev/null -X POST http://127.0.0.1:18080/api/auth/sign-up/email \
            -H 'content-type: application/json' \
            -H 'origin: http://127.0.0.1:18080' \
            --data '{"email":"image-ci@looktag.studio","password":"correct-horse-battery-1","name":"Image CI"}')
          printf '%s' "$cookie" | grep -q '__Host-looktag.session_token='
          printf '%s' "$cookie" | grep -q 'Secure'
          docker stats --no-stream --format 'rss_after_signup={{.MemUsage}}' looktag-ci
      - name: Missing database stays up and hides the canary
        run: |
          set -euo pipefail
          docker run -d --name looktag-neg \
            -e NODE_ENV=production \
            -e BETTER_AUTH_SECRET=canary-do-not-leak-zz \
            -e BETTER_AUTH_URL=https://looktag.example \
            -e APP_URL=https://looktag.example \
            -p 18081:8080 looktag:ci
          sleep 3
          test "$(docker inspect -f '{{.State.Running}}' looktag-neg)" = "true"
          code=$(curl --silent -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:18081/healthz)
          test "$code" = "503"
          grep -q DATABASE_URL /tmp/health.json
          if grep -q canary-do-not-leak-zz /tmp/health.json; then
            echo "secret leaked" >&2
            exit 1
          fi
          curl --silent -H 'accept: text/html' http://127.0.0.1:18081/ > /tmp/config.html
          grep -q 'Configuration error' /tmp/config.html
          if grep -q canary-do-not-leak-zz /tmp/config.html; then
            echo "secret leaked in html" >&2
            exit 1
          fi
