# Render does not read this file. Production stays `npm run build` / `npm start`
# on the Node server. Netlify production builds fail closed below.
# The preview workflow deploys with
# `netlify deploy --alias pr-<n> --context deploy-preview`.
# Publish dir is Nitro's Netlify preset public output (`dist`).
# Context environment variables are build-time only. They do not reach functions.
# The workflow bakes BETTER_AUTH_URL, APP_URL, and the database URL into the server.

[build]
  command = "npm run build:preview"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fail closed so a Git-linked production build cannot publish this site.
[context.production]
  command = 'echo "Netlify production deploys disabled" && exit 1'

[context.deploy-preview]
  command = "npm run build:preview"

[context.deploy-preview.environment]
  APP_ENV = "preview"
  VITE_AUTH_ENABLED = "true"

# Same flags if a deploy uses the branch-deploy context. The workflow itself
# passes --context deploy-preview together with --alias pr-<n>.
[context.branch-deploy]
  command = "npm run build:preview"

[context.branch-deploy.environment]
  APP_ENV = "preview"
  VITE_AUTH_ENABLED = "true"
